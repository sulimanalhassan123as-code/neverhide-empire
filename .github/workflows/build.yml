name: Build APK

# NOTE: push trigger disabled — the GitHub account is currently billing-
# locked and every auto-run dies at startup ("account is locked due to a
# billing issue"). Re-enable push triggers after the lock is lifted.
# Builds meanwhile happen in the Superagent sandbox (proven since v2.5.2).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Ensure SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Ensure signing keystore exists
        run: |
          if [ ! -f empire-release.keystore ]; then
            keytool -genkeypair -keystore empire-release.keystore \
              -storetype JKS -storepass neverhide2024 -keypass neverhide2024 \
              -alias empire-key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Never Hide Empire, OU=Never Hide Tech, O=Never Hide, L=Accra, C=GH"
            git config user.name "Empire CI"
            git config user.email "ci@neverhide.tech"
            git add empire-release.keystore
            git commit -m "ci: add signing keystore"
            git push || echo "PUSH_FAILED_CONTINUE"
            echo "KEYSTORE_CREATED_AND_PUSHED"
          else
            echo "KEYSTORE_ALREADY_PRESENT"
          fi

      - name: Build release APK (log captured)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neverhide-empire-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

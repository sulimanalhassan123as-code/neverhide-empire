name: Build APK

# NOTE: push trigger disabled — the GitHub account is currently billing-
# locked and every auto-run dies at startup ("account is locked due to a
# billing issue"). Re-enable push triggers after the lock is lifted.
# Builds meanwhile happen in the Superagent sandbox (proven since v2.5.2).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Hardened 2026-11-04: this job only builds and uploads artifacts. It no
    # longer commits or pushes anything (the keystore-push step was removed in
    # v2.13.3), so write access was unused privilege on a workflow that decodes
    # a secret onto disk. Read is sufficient.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Ensure SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      # SECURITY (2026-11-03, rebuilt 2026-11-05):
      # This step used to hardcode the keystore password AND commit a generated
      # keystore back into a PUBLIC repo, which would have published the signing
      # key and re-keyed every future APK. Both are gone.
      #
      # The keystore now travels as a HEX string in the KEYSTORE_HEX repo secret
      # and is materialised once, on an ephemeral GitHub-hosted runner, into
      # $RUNNER_TEMP — outside the repository workspace:
      #   • input is a repo secret, never untrusted user data
      #   • umask 077 + chmod 600
      #   • never committed, never uploaded as an artifact
      #   • shredded by the "Shred signing material" step even if the build fails
      - name: Restore signing keystore from secret
        env:
          KEYSTORE_HEX: ${{ secrets.KEYSTORE_HEX }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_HEX:-}" ]; then
            echo "::error::KEYSTORE_HEX secret is missing. Refusing to build unsigned or re-keyed."
            exit 1
          fi
          KS="$RUNNER_TEMP/empire-release.keystore"
          umask 077
          python3 -c "import sys,binascii; sys.stdout.buffer.write(binascii.unhexlify(sys.stdin.read().strip()))" \
            <<< "$KEYSTORE_HEX" > "$KS"
          chmod 600 "$KS"
          echo "KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          echo "keystore restored to \$RUNNER_TEMP ($(wc -c < "$KS") bytes, mode 600)"

      # Passwords reach Gradle through local.properties, which is gitignored and
      # is the same mechanism local builds use. No literal ever touches the repo.
      - name: Write local.properties from secrets
        env:
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          BRIDGE_SECRET: ${{ secrets.BRIDGE_SECRET }}
        run: |
          umask 077
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "keystore.path=$KEYSTORE_PATH"
            echo "keystore.storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keystore.keyPassword=$KEYSTORE_KEY_PASSWORD"
            echo "bridge.secret=$BRIDGE_SECRET"
          } > local.properties
          chmod 600 local.properties
          echo "local.properties written (mode 600, path outside repo)"

      - name: Build release APK (log captured)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Shred signing material
        if: always()
        run: |
          shred -u "$RUNNER_TEMP/empire-release.keystore" 2>/dev/null || rm -f "$RUNNER_TEMP/empire-release.keystore"
          shred -u local.properties 2>/dev/null || rm -f local.properties
          find . -maxdepth 2 -name "*.keystore" -o -maxdepth 2 -name "*.jks" | tee /dev/stderr | wc -l
          echo "signing material removed"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neverhide-empire-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

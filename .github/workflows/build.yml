name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Ensure SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Ensure signing keystore exists
        run: |
          if [ ! -f empire-release.keystore ]; then
            keytool -genkeypair -keystore empire-release.keystore \
              -storetype JKS -storepass neverhide2024 -keypass neverhide2024 \
              -alias empire-key -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Never Hide Empire, OU=Never Hide Tech, O=Never Hide, L=Accra, C=GH"
            git config user.name "Empire CI"
            git config user.email "ci@neverhide.tech"
            git add empire-release.keystore
            git commit -m "ci: add signing keystore"
            git push
            echo "KEYSTORE_CREATED_AND_PUSHED"
          else
            echo "KEYSTORE_ALREADY_PRESENT"
          fi

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: neverhide-empire-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90
